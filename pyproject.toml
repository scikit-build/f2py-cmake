[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "f2py-cmake"
authors = [
  { name = "Henry Schreiner", email = "henryfs@princeton.edu" },
]
description = "CMake helpers for building F2Py modules"
readme = "README.md"
license.file = "LICENSE"
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "numpy",
  "importlib_resources; python_version<'3.9'",
]

[project.entry-points."cmake.module"]
any = "f2py_cmake.cmake"

[project.scripts]
f2py-cmake = "f2py_cmake.__main__:main"

[dependency-groups]
test = [
  "pytest >=6",
  "scikit-build-core",
]
dev = [{ include-group = "test" }]

[project.urls]
Homepage = "https://github.com/scikit-build/f2py-cmake"
"Bug Tracker" = "https://github.com/scikit-build/f2py-cmake/issues"
Discussions = "https://github.com/scikit-build/f2py-cmake/discussions"
Changelog = "https://github.com/scikit-build/f2py-cmake/releases"


[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/f2py_cmake/_version.py"

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
extra-dependencies = ["cmake", "ninja"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  # f2py modules don't declare free-threading support, so a free-threaded
  # interpreter warns when re-enabling the GIL to import one.
  "ignore:The global interpreter lock:RuntimeWarning",
]
log_level = "INFO"
testpaths = [
  "tests",
]


[tool.coverage]
run.source = ["f2py_cmake"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.8"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[tool.ruff]
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "PLR2004", # Magic value used in comparison
  "S101",    # Assert is used by mypy and pytest
  "S603",    # We aren't using untrusted input
  "D",       # Too many doc requests
  "COM812",  # Trailing commas teach the formatter
  "CPY001",  # No copyright notices
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "INP001"]
"noxfile.py" = ["T20"]


[tool.pylint]
py-version = "3.8"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "wrong-import-position",
]


[tool.repo-review.ignore]
PY004 = "All docs in README"
