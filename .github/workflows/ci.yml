name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

permissions: {}

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --hook-stage manual --all-files
      - name: Run PyLint
        run: pipx run nox -s pylint -- --output-format=github

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read # Checkout the repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
        runs-on: [ubuntu-latest, macos-latest]

        include:
          - python-version: "pypy-3.11"
            runs-on: ubuntu-latest
          - python-version: "3.14"
            runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install gfortran
        if: runner.os == 'macOS'
        run: |
          echo "gfortran: $(which gfortran)"
          brew reinstall gfortran
          echo "gfortran: $(which gfortran)"

      - name: Set up Fortran (Windows)
        if: runner.os == 'Windows'
        uses: fortran-lang/setup-fortran@be037f0a45b1160f139d4ccd0b96f9e9bfd6a682 # v1.10.0
        with:
          compiler: gcc
          version: 13

      - name: Use Ninja + MinGW (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # setup-fortran installs MinGW via choco, which only edits the machine
        # PATH registry; GitHub Actions doesn't reload that into the running job.
        # Find the bin dir on the machine PATH (layout differs per MinGW version)
        # and add it, and force Ninja since CMake defaults to the Visual Studio
        # generator on Windows, which has no Fortran support.
        run: |
          $gf = Get-ChildItem -Path C:\ProgramData -Filter gfortran.exe -Recurse -Depth 6 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $gf) {
            Write-Host "Machine PATH: $([Environment]::GetEnvironmentVariable('Path', 'Machine'))"
            throw 'gfortran.exe not found under C:\ProgramData'
          }
          $bin = Split-Path $gf.FullName
          Write-Host "MinGW bin: $bin"
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test package
        run: uv run pytest --durations=20
